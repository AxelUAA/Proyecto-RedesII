services:
  backend:
    build: ./reverse-proxy/backend
    container_name: backend
    expose:
      - "5000"            # lo expone SOLO dentro de Docker
    networks:
      - appnet

  proxy:
    image: nginx:alpine
    container_name: proxy
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"         # abrirá http://localhost:8080
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
